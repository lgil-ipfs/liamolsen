<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" fill="none">
  <!-- Compact icon: slanted box with mountains, sun, waves -->
  <g transform="translate(0, 2) scale(0.58)">
    <polygon points="8,0 60,0 52,52 0,52" fill="#FEEAE7"/>
    <circle cx="46" cy="12" r="7" fill="#432D32"/>
    <polygon points="4,44 20,20 36,44" fill="#432D32"/>
    <polygon points="22,44 38,26 54,44" fill="#432D32" opacity="0.5"/>
    <path d="M2 47 Q10 43 18 47 Q26 51 34 47 Q42 43 50 47" stroke="#432D32" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- "Liam" in Salmon Red -->
  <text x="44" y="36" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#EC6059" letter-spacing="0.5">Liam</text>
  <!-- "Olsen" in Fishbone White -->
  <text x="108" y="36" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#FEEAE7" letter-spacing="0.5">Olsen</text>
  <!-- Vertical divider -->
