  <!-- "North Van" in Tidepool Teal -->
  <text x="204" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#74B6BC" letter-spacing="2">NORTH</text>
  <text x="204" y="46" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#74B6BC" letter-spacing="3.5">VAN</text>
