<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" fill="none">
  <!-- White box background for use over dark images -->
  <rect x="0" y="0" width="340" height="60" rx="3" fill="#FEEAE7"/>
  <!-- Compact icon -->
  <g transform="translate(6, 4) scale(0.52)">
    <polygon points="8,0 60,0 52,52 0,52" fill="#72454A"/>
    <circle cx="46" cy="12" r="7" fill="#EECAC4"/>
    <polygon points="4,44 20,20 36,44" fill="#EECAC4"/>
    <polygon points="22,44 38,26 54,44" fill="#FEEAE7" opacity="0.6"/>
    <path d="M2 47 Q10 43 18 47 Q26 51 34 47 Q42 43 50 47" stroke="#EECAC4" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- "Liam" in Salmon Red -->
  <text x="42" y="36" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#EC6059" letter-spacing="0.5">Liam</text>
  <!-- "Olsen" in Beaver Brown -->
  <text x="102" y="36" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#72454A" letter-spacing="0.5">Olsen</text>
  <!-- Vertical divider -->
  <line x1="186" y1="10" x2="186" y2="50" stroke="#72454A" stroke-width="1.5" opacity="0.3"/>
  <!-- "North Van" in Tidepool Teal -->
  <text x="196" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#74B6BC" letter-spacing="2">NORTH</text>
  <text x="196" y="44" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#74B6BC" letter-spacing="3.5">VAN</text>
</svg>
