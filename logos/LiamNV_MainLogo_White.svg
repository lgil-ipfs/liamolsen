<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" fill="none">
  <!-- Icon: slanted box with mountains, sun, waves -->
  <g transform="translate(4, 8)">
    <!-- Parallelogram / slanted box -->
    <polygon points="18,0 102,0 88,90 4,90" fill="#FEEAE7"/>
    <!-- Sun circle -->
    <circle cx="77" cy="20" r="11" fill="#432D32"/>
    <!-- Mountain peaks -->
    <polygon points="16,78 38,38 60,78" fill="#432D32"/>
    <polygon points="38,78 62,46 86,78" fill="#432D32" opacity="0.5"/>
    <!-- Ocean waves -->
    <path d="M8 82 Q18 77 28 82 Q38 87 48 82 Q58 77 68 82 Q78 87 86 82" stroke="#432D32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M6 88 Q16 83 26 88 Q36 93 46 88 Q56 83 66 88 Q76 93 84 88" stroke="#432D32" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Text: "for" -->
  <text x="116" y="38" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#FEEAE7" letter-spacing="1">for</text>
  <!-- Text: "NORTH" -->
  <text x="112" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#FEEAE7" letter-spacing="1">NORTH</text>
  <!-- Text: "VAN" -->
  <text x="112" y="118" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#FEEAE7" letter-spacing="4">VAN</text>
  <!-- Divider line -->
  <line x1="112" y1="128" x2="216" y2="128" stroke="#FEEAE7" stroke-width="1.5"/>
  <!-- Text: "CITY COUNCIL" -->
  <text x="112" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FEEAE7" letter-spacing="3">CITY COUNCIL</text>
</svg>
